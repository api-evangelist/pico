summary: >-
  The Pico API is retired. Pico rebranded to Hype (hype.co) in 2023, and in
  February 2026 Hype was acquired by MMA.inc and wound down. hype.co now serves a
  single static acquisition notice; the application at app.hype.co returns 404, the
  documented API host api.trypico.com no longer resolves, and the developer
  reference at docs.trypico.com returns an S3 "NoSuchBucket" 404. No successor
  developer surface has been published on hype.co or mma.inc.
