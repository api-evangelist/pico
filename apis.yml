name: Pico
description: >-
  Pico was a creator-monetization and CRM platform for online creators, publishers,
  and media companies, built in New York and backed by Bloomberg Beta. It combined
  an audience CRM with email capture, landing pages, paywalls, memberships, and
  subscription payments in a single tool so creators could identify their audience,
  gate premium content, and convert readers into paying members. Pico raised a
  $6.5M round in 2021 ("Pico 2.0") and a $10M Series A in 2023, when it rebranded
  to Hype (hype.co) and refocused on link-in-bio, lead generation, and growth tools
  for creators, gyms, coaches, and athletes. In February 2026 Hype was acquired by
  MMA.inc and the product was wound down. The developer API — authenticated with an
  X-Api-Key header and documented at docs.trypico.com — is retired: the API host
  api.trypico.com no longer resolves, the reference bucket has been deleted, and
  hype.co now serves only an acquisition notice directing users to support@hype.co.
