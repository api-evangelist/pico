name: Pico
description: >-
  Pico is a creator-monetization and CRM platform for online creators, publishers,
  and media companies, built in New York and backed by Bloomberg Beta. It combines
  an audience CRM with email capture, landing pages, paywalls, memberships, and
  subscription payments in a single tool so creators can identify their audience,
  gate premium content, and convert readers into paying members. Pico raised a
  $6.5M round in 2021 ("Pico 2.0") and a $10M Series A in 2023, when it rebranded
  to Hype (hype.co). It exposes a developer API — authenticated with an X-Api-Key
  header and documented at docs.trypico.com — for searching and managing contacts
  and integrating the platform into custom workflows.
